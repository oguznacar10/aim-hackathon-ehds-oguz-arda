<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datenzugang - Health Data Access Body</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="masthead">
  <p class="product"><span class="product-name">Datenzugang</span> <span class="product-role">Health Data Access Body</span></p>
  <nav class="views" aria-label="View">
    <button type="button" class="view-btn" data-view="applicant" aria-pressed="true">Applicant</button>
    <button type="button" class="view-btn" data-view="staff" aria-pressed="false">Staff</button>
  </nav>
</header>

<main id="applicant" class="view">
  <section class="intake" aria-labelledby="intake-title">
    <div class="intake-head">
      <h1 id="intake-title">Request access to health data</h1>
      <label class="example-pick"><span class="lbl">Load an example<span class="info" tabindex="0" role="button" aria-label="About Load an example" aria-describedby="tip-example">i</span><span class="tip" role="tooltip" id="tip-example">Fills the form with one of the 10 sample requests from the challenge, so you can see how each is decided.</span></span>
        <select id="example"><option value="">Choose a sample request</option></select>
      </label>
    </div>
    <form id="request-form" novalidate>
      <input type="hidden" name="id">
      <div class="row two">
        <label><span class="lbl">Applicant name<span class="info" tabindex="0" role="button" aria-label="About Applicant name" aria-describedby="tip-name">i</span><span class="tip" role="tooltip" id="tip-name">The person responsible for the request. The name appears on the decision notice.</span></span><input name="name" required autocomplete="off"></label>
        <label><span class="lbl">Organisation<span class="info" tabindex="0" role="button" aria-label="About Organisation" aria-describedby="tip-organisation">i</span><span class="tip" role="tooltip" id="tip-organisation">The university, authority or company you apply for. Companies may apply too; who you are is not a reason to refuse.</span></span><input name="organisation" required autocomplete="off"></label>
      </div>
      <div class="row two">
        <label><span class="lbl">Country<span class="info" tabindex="0" role="button" aria-label="About Country" aria-describedby="tip-country">i</span><span class="tip" role="tooltip" id="tip-country">Two-letter code of the country your organisation is based in, for example AT or DE.</span></span><input name="country" maxlength="2" placeholder="AT" autocomplete="off"></label>
      </div>
      <label><span class="lbl">Purpose<span class="info" tabindex="0" role="button" aria-label="About Purpose" aria-describedby="tip-purpose">i</span><span class="tip" role="tooltip" id="tip-purpose">Why you need the data and what it will be used for. Some purposes are prohibited (Art. 54), for example setting insurance premiums, advertising, or decisions about individual people.</span></span><textarea name="purpose" rows="3" required></textarea></label>
      <label><span class="lbl">Question<span class="info" tabindex="0" role="button" aria-label="About Question" aria-describedby="tip-question">i</span><span class="tip" role="tooltip" id="tip-question">What you want to know, in one or two sentences. If you need patient-level records rather than statistics, explain here why statistics are not enough.</span></span><textarea name="question" rows="3" required></textarea></label>
      <label><span class="lbl">Definitions<span class="info" tabindex="0" role="button" aria-label="About Definitions" aria-describedby="tip-definitions">i</span><span class="tip" role="tooltip" id="tip-definitions">One rule per line. Define each term, for example “Adult = aged 18 or older on 31 December 2025.” End with what to report, for example “Report per hospital: adults.”</span></span>
        <textarea name="definitions" rows="4"></textarea></label>
      <p id="form-error" class="form-error" role="alert" hidden></p>
      <button type="submit" class="primary" id="submit">Submit request</button>
    </form>
  </section>

  <section id="notice-slot" class="notice-slot" aria-live="polite"></section>
</main>

<main id="staff" class="view" hidden>
  <aside class="queue" aria-labelledby="queue-title">
    <div class="queue-head">
      <h1 id="queue-title">Cases</h1>
      <button type="button" class="quiet" id="run-samples">Decide the 10 sample requests</button>
    </div>
    <section class="hospitals" aria-labelledby="hosp-title">
      <h2 id="hosp-title" class="group-title">Hospital databases</h2>
      <div id="hospital-list"></div>
      <p class="hosp-note">Each hospital keeps its own patients. Questions run in each database; only totals come back.</p>
    </section>
    <div id="queue-list"></div>
  </aside>
  <section id="casefile" class="casefile" aria-live="polite">
    <p class="empty">Select a case to open its file.</p>
  </section>
</main>

<template id="notice-tpl">
  <article class="notice">
    <header class="notice-head">
      <p class="meta"><span class="code case-no"></span><span class="applicant"></span><span class="date"></span></p>
      <h2 class="verdict"></h2>
      <p class="verdict-code"><span class="mark"></span><span class="code decision-code"></span></p>
      <p class="review-flag" hidden>A case officer will check this decision before it is final.</p>
    </header>
    <section class="path-wrap" aria-label="How the decision was reached">
      <h3>How we decided</h3>
      <ol class="path"></ol>
    </section>
    <section class="reasons-wrap">
      <h3>Reasons</h3>
      <div class="reasons"></div>
    </section>
    <section class="outcome"></section>
  </article>
</template>

<script src="/app.js"></script>
</body>
</html>
