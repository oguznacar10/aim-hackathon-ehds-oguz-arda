# Dependabot version updates. Docs: https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configure-version-updates
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # CI's test tools (requirements-ci.txt)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      ci-lint:
        patterns: ["ruff"]
      ci-test-tools:
        patterns: ["*"]
        exclude-patterns: ["ruff"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
